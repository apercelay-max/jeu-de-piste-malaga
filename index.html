<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Le Trésor de Pepe el Cenachero</title>
<meta name="description" content="Jeu de piste familial dans l'hypercentre de Málaga pour 4 jeunes enquêteurs (5, 8, 9 et 12 ans), avec navigation Google Maps intégrée.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bevan&family=Rubik:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --cal:#EFF2EE; --paper:#FBFAF5; --ink:#1E2523; --ink-soft:#5B6663; --line:#D8DED6;
  --azulejo:#1C6E8C; --azulejo-ink:#FFFFFF;
  --albero:#C97A2B; --albero-ink:#FFFFFF;
  --buganvilla:#C23B6C; --buganvilla-ink:#FFFFFF;
  --jazmin:#5D7C48; --jazmin-ink:#FFFFFF;
  --sol:#C98A0E; --sol-ink:#FFFFFF;
  --danger:#B23B26; --danger-ink:#FFFFFF;
  --shadow-hard: rgba(30,37,35,0.85); --shadow-soft: rgba(30,37,35,0.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cal:#141B19; --paper:#1D2523; --ink:#EDF2EF; --ink-soft:#AEB9B5; --line:#334039;
    --azulejo:#5FC1E8; --azulejo-ink:#0A2530;
    --albero:#F2A857; --albero-ink:#2B1B08;
    --buganvilla:#EA7FAE; --buganvilla-ink:#3A0E1E;
    --jazmin:#A9C98C; --jazmin-ink:#16210E;
    --sol:#F0C246; --sol-ink:#2B1B08;
    --danger:#E8695F; --danger-ink:#2B0805;
    --shadow-hard: rgba(0,0,0,0.85); --shadow-soft: rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --cal:#141B19; --paper:#1D2523; --ink:#EDF2EF; --ink-soft:#AEB9B5; --line:#334039;
  --azulejo:#5FC1E8; --azulejo-ink:#0A2530;
  --albero:#F2A857; --albero-ink:#2B1B08;
  --buganvilla:#EA7FAE; --buganvilla-ink:#3A0E1E;
  --jazmin:#A9C98C; --jazmin-ink:#16210E;
  --sol:#F0C246; --sol-ink:#2B1B08;
  --danger:#E8695F; --danger-ink:#2B0805;
  --shadow-hard: rgba(0,0,0,0.85); --shadow-soft: rgba(0,0,0,0.35);
}
.char-camille{--char:var(--buganvilla);--char-ink:var(--buganvilla-ink);}
.char-maeva{--char:var(--sol);--char-ink:var(--sol-ink);}
.char-madeline{--char:var(--azulejo);--char-ink:var(--azulejo-ink);}
.char-leopold{--char:var(--albero);--char-ink:var(--albero-ink);}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cal); color:var(--ink);
  font-family:'Rubik',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.45;
  min-height:100vh;
}
h1,h2,h3,.disp{font-family:'Bevan',Georgia,'Times New Roman',serif; font-weight:400; text-wrap:balance; letter-spacing:.2px;}
.mono{font-family:'Space Mono','SFMono-Regular',Consolas,monospace;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--azulejo); outline-offset:2px;}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

.app-shell{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:0 0 48px;}

/* ---- tile badge chrome ---- */
.tile{
  border:3px solid var(--ink); border-radius:6px; background:var(--paper);
  box-shadow:3px 3px 0 var(--shadow-hard);
  font-family:'Space Mono',monospace; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
}
.topbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:14px 16px 10px; position:sticky; top:0; z-index:5;
  background:var(--cal); border-bottom:1px solid var(--line);
}
.topbar .tile{padding:6px 10px; font-size:.72rem; display:flex; align-items:center; gap:6px;}
.tile-char{background:var(--char); color:var(--char-ink); border-color:var(--ink);}
.topbar .spacer{flex:1;}
.icon-btn{
  border:3px solid var(--ink); border-radius:6px; background:var(--paper); color:var(--ink);
  box-shadow:2px 2px 0 var(--shadow-hard); width:40px; height:40px; font-size:1.1rem;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.icon-btn:active{transform:translate(2px,2px); box-shadow:none;}

.status-row{display:flex; gap:6px; padding:10px 16px 0; flex-wrap:wrap;}
.status-chip{
  display:flex; align-items:center; gap:5px; padding:6px 12px; border-radius:20px; font-family:inherit;
  border:2px solid var(--line); background:var(--paper); color:var(--ink); font-size:.82rem; font-weight:600;
  cursor:pointer; opacity:.6;
}
.status-chip.active{opacity:1; border-color:var(--char, var(--ink)); box-shadow:2px 2px 0 var(--shadow-hard);}
.status-chip.done{background:var(--jazmin); color:var(--jazmin-ink); border-color:var(--jazmin); opacity:.85;}
.status-chip.done.active{opacity:1; border-color:var(--ink);}

.progress-track{height:10px; border-radius:6px; background:var(--line); border:2px solid var(--ink); overflow:hidden; margin:0 16px;}
.progress-fill{height:100%; background:var(--azulejo); transition:width .4s ease;}

.badge-strip{display:flex; gap:6px; padding:10px 16px 0; flex-wrap:wrap;}
.badge-piece{
  width:38px; height:38px; border-radius:50%; border:2.5px solid var(--ink); background:var(--paper);
  display:flex; align-items:center; justify-content:center; font-size:1.1rem;
  box-shadow:2px 2px 0 var(--shadow-hard);
}
.badge-piece.empty{opacity:.25; border-style:dashed; box-shadow:none;}

/* ---- content ---- */
.screen{padding:18px 16px 8px; display:flex; flex-direction:column; gap:18px;}

.mascot-row{display:flex; gap:10px; align-items:flex-start;}
.mascot-face{flex:none;}
.pepe-bob{transform-origin:60px 110px; animation:pepeBob 3.4s ease-in-out infinite;}
@keyframes pepeBob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-3px) rotate(-1.2deg);}}
.pepe-eyes{transform-origin:60px 65px; animation:pepeBlink 5.5s ease-in-out infinite;}
@keyframes pepeBlink{0%,88%,100%{transform:scaleY(1);}92%{transform:scaleY(.12);}}
.pepe-mouth{animation:pepeTalk 2.4s ease-in-out infinite;}
@keyframes pepeTalk{0%,100%{d:path("M47 90 Q60 98 73 90");}50%{d:path("M49 91 Q60 93 71 91");}}
.mascot-bubble{
  position:relative; background:var(--paper); border:2.5px solid var(--ink); border-radius:18px 18px 18px 4px;
  padding:14px 16px; box-shadow:3px 3px 0 var(--shadow-hard);
  background-image:repeating-linear-gradient(var(--paper) 0 27px, var(--line) 27px 28px);
  background-position:0 10px;
  animation:bubblePop .4s cubic-bezier(.34,1.56,.64,1);
  transform-origin:12px 100%;
}
@keyframes bubblePop{from{transform:scale(.8); opacity:0;}to{transform:scale(1); opacity:1;}}
.mascot-bubble::before{
  content:""; position:absolute; left:-10px; top:38px; width:16px; height:16px;
  background:var(--paper); border-left:2.5px solid var(--ink); border-bottom:2.5px solid var(--ink);
  clip-path:polygon(100% 0, 100% 100%, 0 100%); transform:rotate(3deg);
}
.mascot-bubble p{margin:0 0 8px; max-width:58ch;}
.mascot-bubble p:last-child{margin-bottom:0;}
.mascot-name{font-family:'Bevan',serif; color:var(--albero); font-size:.95rem; margin:0 0 4px;}
.extra-fact{
  margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); font-size:.88rem; color:var(--ink-soft);
}
.anecdote{
  margin-top:10px; padding:8px 10px; border-radius:10px; background:color-mix(in srgb, var(--buganvilla) 12%, transparent);
  font-size:.9rem; color:var(--ink);
}
.defi-card .btn{align-self:flex-start;}

.card{
  background:var(--paper); border:2px solid var(--line); border-radius:14px; padding:16px;
  box-shadow:0 3px 0 var(--shadow-soft); display:flex; flex-direction:column; gap:12px;
}
.card.char{border-color:var(--char); border-width:2.5px;}
.eyebrow{
  display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:.72rem;
  text-transform:uppercase; letter-spacing:.08em; color:var(--char, var(--ink-soft)); font-weight:700;
}
.eyebrow .dot{width:8px; height:8px; border-radius:50%; background:var(--char, var(--azulejo));}
.prompt{font-size:1.12rem; font-weight:600; margin:0;}

.choice-grid{display:grid; gap:10px;}
.choice-btn{
  text-align:left; padding:12px 14px; border-radius:10px; border:2.5px solid var(--ink); background:var(--cal);
  font-size:1rem; font-weight:500; cursor:pointer; color:var(--ink); box-shadow:2px 2px 0 var(--shadow-hard);
}
.choice-btn:active{transform:translate(2px,2px); box-shadow:none;}
.choice-btn.correct{background:var(--jazmin); color:var(--jazmin-ink); border-color:var(--jazmin);}
.choice-btn.wrong{background:var(--danger); color:var(--danger-ink); border-color:var(--danger); animation:shake .35s;}
.choice-btn:disabled{cursor:default;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

.input-row{display:flex; gap:10px; flex-wrap:wrap;}
.field{
  flex:1; min-width:140px; padding:12px 14px; border-radius:10px; border:2.5px solid var(--ink);
  background:var(--cal); color:var(--ink); font-size:1.15rem; font-family:'Space Mono',monospace;
}
.btn{
  border:3px solid var(--ink); border-radius:10px; padding:12px 20px; font-weight:700; font-size:1rem;
  cursor:pointer; box-shadow:3px 3px 0 var(--shadow-hard); background:var(--paper); color:var(--ink);
}
.btn:active{transform:translate(3px,3px); box-shadow:none;}
.btn-primary{background:var(--azulejo); color:var(--azulejo-ink); border-color:var(--ink);}
.btn-go{background:var(--jazmin); color:var(--jazmin-ink);}
.btn-block{width:100%;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-ghost{background:transparent; box-shadow:none; border-style:dashed; font-size:.85rem; padding:8px 14px;}

.feedback{border-radius:10px; padding:12px 14px; font-weight:600;}
.feedback.ok{background:var(--jazmin); color:var(--jazmin-ink);}
.feedback.no{background:var(--danger); color:var(--danger-ink);}
.hint{font-size:.9rem; color:var(--ink-soft); font-style:italic; margin:0;}

.stamp{
  display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border:3px solid var(--jazmin);
  color:var(--jazmin); border-radius:8px; font-family:'Space Mono',monospace; text-transform:uppercase;
  font-weight:700; letter-spacing:.05em; transform:rotate(-4deg); animation:stampIn .3s ease-out;
}
@keyframes stampIn{from{transform:rotate(-4deg) scale(2); opacity:0;} to{transform:rotate(-4deg) scale(1); opacity:1;}}

.maps-link{
  display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none;
  background:var(--azulejo); color:var(--azulejo-ink); border:3px solid var(--ink); border-radius:12px;
  padding:16px; font-weight:700; font-size:1.05rem; box-shadow:3px 3px 0 var(--shadow-hard);
}
.maps-link:active{transform:translate(3px,3px); box-shadow:none;}

.char-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:420px){.char-grid{grid-template-columns:1fr;}}
.char-card{
  border:3px solid var(--ink); border-radius:14px; padding:16px; background:var(--paper); cursor:pointer;
  box-shadow:3px 3px 0 var(--shadow-hard); text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center;
}
.char-card:active{transform:translate(3px,3px); box-shadow:none;}
.char-card .avatar{
  width:56px; height:56px; border-radius:50%; background:var(--char); color:var(--char-ink);
  display:flex; align-items:center; justify-content:center; font-size:1.8rem; border:2px solid var(--ink);
}
.char-card .cname{font-family:'Bevan',serif; font-size:1.15rem;}
.char-card .cage{font-family:'Space Mono',monospace; font-size:.78rem; color:var(--ink-soft);}
.char-card .ctag{font-size:.82rem; color:var(--char);}

.hero{text-align:center; padding:28px 16px 6px;}
.hero h1{font-size:2rem; margin:6px 0 4px; color:var(--albero);}
.hero p{color:var(--ink-soft); max-width:44ch; margin:0 auto;}

.kit-list{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none;}
.kit-list li{display:flex; gap:10px; align-items:flex-start; font-size:.95rem;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(20,27,25,.55); display:flex; align-items:flex-end;
  justify-content:center; z-index:20; padding:0;
}
@media (min-width:640px){.modal-overlay{align-items:center;}}
.modal{
  background:var(--paper); border-radius:18px 18px 0 0; border:3px solid var(--ink); border-bottom:none;
  max-width:560px; width:100%; max-height:82vh; overflow-y:auto; padding:20px 18px 26px;
  box-shadow:0 -4px 0 var(--shadow-hard);
}
@media (min-width:640px){.modal{border-radius:16px; border-bottom:3px solid var(--ink); box-shadow:5px 5px 0 var(--shadow-hard);}}
.modal h2{margin-top:0;}
.modal-close{float:right;}

.diploma{border:4px double var(--albero); border-radius:16px; padding:22px; text-align:center; background:var(--paper);}
.diploma .seal{font-size:3rem;}
.pieces-final{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:14px 0;}

.confetti-layer{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:30;}
.confetto{position:absolute; top:-20px; font-size:1.4rem; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg); opacity:.9;}}

.guide-step{border-left:4px solid var(--albero); padding-left:12px; margin-bottom:14px;}
.guide-step h3{margin:0 0 4px; font-size:1rem;}
.guide-step p{margin:0; font-size:.92rem; color:var(--ink-soft);}

.footer-note{text-align:center; font-size:.78rem; color:var(--ink-soft); padding:18px 16px 0;}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = 'pepe-cenachero-hunt-v3';

  var CHARACTERS = {
    camille:  { key:'camille',  name:'Camille',  age:5,  emoji:'🦋', tagline:'La Chasseuse de Couleurs' },
    maeva:    { key:'maeva',    name:'Maeva',    age:8,  emoji:'🌻', tagline:'La Guetteuse' },
    madeline: { key:'madeline', name:'Madeline', age:9,  emoji:'🔍', tagline:'L’Enquêtrice' },
    leopold:  { key:'leopold',  name:'Léopold',  age:12, emoji:'🧭', tagline:'Le Décrypteur' }
  };
  var CHAR_ORDER = ['camille','maeva','madeline','leopold'];

  function buildMapsUrl(query){
    // Une simple recherche (pas un itinéraire tout calculé) : c'est l'enfant qui
    // appuiera lui-même sur « Itinéraire » puis choisira le mode piéton dans l'appli.
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
  }
  var FULL_ROUTE_URL = 'https://www.google.com/maps/dir/?api=1' +
    '&origin=' + encodeURIComponent('Plaza de la Marina, Málaga, Espagne') +
    '&destination=' + encodeURIComponent('Puente de los Alemanes, Málaga, Espagne') +
    '&waypoints=' + encodeURIComponent('Calle Marqués de Larios, Málaga, Espagne') + '|' +
      encodeURIComponent('Plaza de la Constitución, Málaga, Espagne') + '|' +
      encodeURIComponent('Iglesia de San Juan Bautista, Málaga, Espagne') + '|' +
      encodeURIComponent('Mercado Central de Atarazanas, Málaga, Espagne') +
    '&travelmode=walking';

  var STEPS = [
    {
      title:"La Plaza de la Marina", subtitle:"Un conteur danois au soleil", distance:"0,0 km",
      mapsQuery:"Plaza de la Marina, Málaga, Espagne",
      story:"Regardez ce monsieur en bronze, assis tranquillement sur un banc avec un carnet à la main : pas de couronne, pas d’épée, pas même un pigeon sur l’épaule. C’est Hans Christian Andersen, l’auteur du Vilain Petit Canard ! Il venait du Danemark, un pays si froid et si pluvieux que même les canards y portent un ciré. En octobre 1862, il a débarqué à Málaga et il a été tellement ébloui par le soleil qu’il a écrit dans son carnet qu’il n’arrivait plus DU TOUT à être triste. Un comble, pour l’inventeur des histoires les plus tristes du monde !",
      anecdote:"Allez donc vérifier : à force que des milliers de touristes viennent s’asseoir à côté de lui pour un selfie, le bronze du banc est-il plus brillant à certains endroits que sur le reste de la statue ?",
      extra:"Andersen avait 57 ans lors de ce voyage, et cela faisait déjà plus de 30 ans qu’il parcourait l’Europe pour fuir le mauvais temps danois. Il avait aussi une peur bien à lui : terrifié à l’idée d’être enterré vivant, il laissait chaque soir un mot sur sa table de nuit disant « Je ne suis pas mort, je dors juste très profondément ! ». Il est mort en 1875, treize ans après ce voyage, sans jamais avoir arrêté d’écrire — ni de voyager.",
      missions:{
        camille:{prompt:"Regarde la statue : Monsieur Andersen est-il assis ou debout ?", type:"choice", options:["Assis 🪑","Debout 🚶"], answer:0,
          success:"Bravo Camille ! Bien assis, comme pour écouter une histoire — ou pour bronzer, allez savoir.", hint:"Regarde s’il a les jambes pliées sur le banc…",
          piece:{emoji:"🪑",label:"Le Banc"}},
        maeva:{prompt:"Regarde ses mains : que tient Andersen ?", type:"choice", options:["Une épée ⚔️","Un carnet 📓","Un parapluie ☂️"], answer:1,
          success:"Exact ! Un conteur ne sort jamais sans son carnet d’idées, même pas pour aller à la plage.", hint:"Ce n’est pas une arme, c’est un objet pour écrire…",
          piece:{emoji:"📓",label:"Le Carnet"}},
        madeline:{prompt:"Observe bien : la statue est-elle posée sur un grand socle de pierre, comme une statue de roi, ou directement sur un banc public comme tout le monde ?", type:"choice",
          options:["Sur un grand socle royal","Sur un simple banc public"], answer:1,
          success:"Bien vu ! Andersen est assis parmi les gens, pas sur un piédestal — même les plus grands conteurs aiment garder les pieds sur le trottoir.", hint:"Cherche s’il y a un bloc de pierre surélevé sous lui…",
          piece:{emoji:"🎩",label:"Le Banc Public"}},
        leopold:{prompt:"Additionne les 4 chiffres de l’année du voyage (1+8+6+2), puis calcule l’écart avec le nombre de lettres du nom de la ville natale d’Andersen, Odense (6 lettres). Quel est ce nombre-pivot ?", type:"number", answer:11,
          success:"Parfait ! 17 et 6 donnent le nombre-pivot 11 — pas besoin de calculatrice, juste dix doigts et un peu de logique.", hint:"1+8+6+2 = 17. Puis 17 − 6 = ?",
          piece:{emoji:"🔢",label:"Nombre 11"}}
      },
      teamRiddle:{prompt:"Demandez à Léopold, le Décrypteur : quel est le nombre-pivot qu’il a trouvé ? Il ouvre la direction à suivre !", type:"number", answer:11,
        success:"Le nombre 11 ouvre la route vers le NORD, direction la grande avenue commerçante ! En avant, moussaillons."},
      funfact:"Un conteur triste, venu d’un pays où il pleut 300 jours par an, incapable de trouver une seule raison d’être triste ici : voilà le vrai miracle andalou !",
      funChallenge:{
        camille:"🗿 Assieds-toi à côté d’Andersen et reste immobile 5 secondes, pas un geste !",
        maeva:"🔍 Touche le banc en bronze : il est chaud ou froid au soleil ? Annonce ta découverte à voix haute !",
        madeline:"📓 Fais semblant d’écrire dans un carnet invisible, l’air très inspiré, pendant 3 secondes.",
        leopold:"🎬 Invente en une phrase la fin d’une histoire triste… qui finit bien, comme Andersen l’aurait fait ici."
      }
    },
    {
      title:"Calle Marqués de Larios", subtitle:"La rue qui dansait", distance:"0,6 km",
      mapsQuery:"Calle Marqués de Larios, Málaga, Espagne",
      story:"Bienvenue sur la plus belle avenue de Málaga, dessinée à la fin du 19e siècle par l’architecte Eduardo Strachan. Regardez les angles des immeubles : tout ronds, comme des bonbons ! Le jour de l’inauguration en 1891, la rue était recouverte d’un vrai parquet en bois ciré, si brillant qu’on la surnommait le « Salón de Baile » — littéralement le salon de danse — comme une immense salle de bal à ciel ouvert. Les habitants marchaient dessus en chaussons de feutre pour ne pas le rayer, et les chiens (et les chevaux !) étaient formellement interdits — pas question de glisser sur une bêtise canine en pleine valse.",
      anecdote:"Imaginez la scène : toute la ville en chaussons pour ne pas abîmer le parquet… jusqu’au jour où une inondation a tout emporté d’un coup, chaussons compris ! Depuis, la rue a un sol en pierre bien plus difficile à noyer.",
      extra:"L’architecte Eduardo Strachan s’est inspiré de la ville américaine de Chicago pour aligner parfaitement les corniches des toits, créant une perspective si rectiligne qu’elle mène tout droit à la Plaza de la Constitución. En 2018, cette rue a aussi battu un record du monde : 3920 danseurs de flamenco en même temps ! Et en 1931, la statue du marquis Larios a même fini à la mer, jetée par des révolutionnaires, avant de revenir sagement sur son socle après la guerre civile — un marquis qui a fait trempette bien malgré lui.",
      missions:{
        camille:{prompt:"Regarde les coins des immeubles, tout en haut : sont-ils pointus ou tout ronds ?", type:"choice", options:["Pointus ◼️","Tout ronds ⬤"], answer:1,
          success:"Bravo ! Des coins tout ronds, comme un bonbon — dommage, on ne peut pas les croquer.", hint:"Lève les yeux vers le sommet des façades…",

        <!-- chapeau de paille à large bord -->
        <ellipse cx="60" cy="44" rx="47" ry="11" style="fill:var(--albero)"/>
        <path d="M27 44 Q29 6 60 6 Q91 6 93 44 Q60 31 27 44Z" style="fill:var(--albero)"/>
        <path d="M29 38 Q60 27 91 38" fill="none" style="stroke:var(--buganvilla)" stroke-width="5" stroke-linecap="round"/>
      </g>
    </svg>`;
  }

  function piecesFor(charKey){
    var pieces = [];
    for (var i=0;i<STEPS.length;i++){
      var m = STEPS[i].missions[charKey];
      if (state.progress[charKey].missionDone[i] && m && m.piece) pieces.push(m.piece);
    }
    return pieces;
  }

  function badgeStripHtml(){
    var pieces = piecesFor(state.active);
    var html = '<div class="badge-strip">';
    for (var i=0;i<STEPS.length;i++){
      if (pieces[i]) html += `<div class="badge-piece" title="${pieces[i].label}">${pieces[i].emoji}</div>`;
      else html += '<div class="badge-piece empty">?</div>';
    }
    return html + '</div>';
  }

  function allMissionsDone(stepIndex){
    return CHAR_ORDER.every(function(k){ return !!state.progress[k].missionDone[stepIndex]; });
  }

  function statusRowHtml(stepIndex){
    return '<div class="status-row">' + CHAR_ORDER.map(function(k){
      var c = CHARACTERS[k];
      var done = !!state.progress[k].missionDone[stepIndex];
      var active = k === state.active;
      return `<button class="status-chip char-${k}${done?' done':''}${active?' active':''}" onclick="PG.switchChar('${k}')">${c.emoji} ${c.name}${done?' ✓':''}</button>`;
    }).join('') + '</div>';
  }

  function topbarHtml(stepIndex){
    var c = CHARACTERS[state.active];
    var stepLabel = stepIndex < STEPS.length ? ('Étape ' + (stepIndex+1) + '/' + STEPS.length) : 'Terminé !';
    var dist = STEPS[Math.min(stepIndex, STEPS.length-1)].distance;
    return `<div class="topbar char-${state.active}">
      <div class="tile tile-char">${c.emoji} ${c.name} · ${c.age} ans</div>
      <div class="tile">${stepLabel}</div>
      <div class="tile">📍 ${dist}</div>
      <div class="spacer"></div>
      <button class="icon-btn" onclick="PG.openModal('kit')" aria-label="Kit de l’enquêteur">🎒</button>
      <button class="icon-btn" onclick="PG.openModal('parent')" aria-label="Espace parent">👪</button>
      <button class="icon-btn" onclick="PG.openModal('reset')" aria-label="Réinitialiser le jeu">↺</button>
    </div>`;
  }

  function normalizeText(v){ return (v||'').toString().trim().toLowerCase(); }

  function missionSectionHtml(step, stepIndex){
    var active = state.active;
    var m = step.missions[active];
    var prog = state.progress[active];
    var done = !!prog.missionDone[stepIndex];
    var attempts = prog.attempts[stepIndex] || 0;
    var c = CHARACTERS[active];
    var body = '';
    if (done){
      body = `<div class="stamp">✔ Validé — ${m.piece.emoji} ${m.piece.label}</div><p>${m.success}</p>`;
    } else {
      body += `<p class="prompt">${m.prompt}</p>`;
      if (m.type === 'choice'){
        body += '<div class="choice-grid">' + m.options.map(function(opt,i){
          return `<button class="choice-btn" onclick="PG.answerChoice(${stepIndex},${i})">${opt}</button>`;
        }).join('') + '</div>';
      } else if (m.type === 'number' || m.type === 'text'){
        var itype = m.type === 'number' ? 'number' : 'text';
        var imode = m.type === 'number' ? ' inputmode="numeric"' : '';
        body += `<div class="input-row">
          <input class="field" type="${itype}"${imode} id="mission-input-${stepIndex}" placeholder="Ta réponse" onkeydown="if(event.key==='Enter')PG.answerField(${stepIndex})">
          <button class="btn btn-primary" onclick="PG.answerField(${stepIndex})">Valider</button>
        </div>`;
      } else if (m.type === 'confirm'){
        body += `<button class="btn btn-go btn-block" onclick="PG.answerConfirm(${stepIndex})">✅ C’est fait !</button>`;
      }
      if (attempts > 0){
        body += `<div class="feedback no">Pas tout à fait ! Réessaie.</div><p class="hint">💡 ${m.hint||''}</p>`;
      }
      if (attempts >= 3 && m.type !== 'confirm'){
        body += `<button class="btn btn-ghost" onclick="PG.revealMission(${stepIndex})">👉 Révéler la réponse</button>`;
      }
    }
    return `<div class="card char char-${active}">
      <div class="eyebrow"><span class="dot"></span>Mission de ${c.name}</div>
      ${body}
    </div>`;
  }

  function teamSectionHtml(step, stepIndex){
    var allDone = allMissionsDone(stepIndex);
    var done = !!state.teamDone[stepIndex];
    var attempts = state.teamAttempts[stepIndex] || 0;
    var tr = step.teamRiddle;
    if (!allDone){
      var left = CHAR_ORDER.filter(function(k){ return !state.progress[k].missionDone[stepIndex]; })
        .map(function(k){ return CHARACTERS[k].name; }).join(', ');
      return `<div class="card"><div class="eyebrow"><span class="dot"></span>Énigme d’équipe 🤝</div>
        <p class="hint">🔒 Il manque encore la mission de : ${left}. Passez-leur l’iPad (pastilles en haut) !</p></div>`;
    }
    var body = '';
    if (done){
      body = `<div class="stamp">✔ Débloqué</div><p>${tr.success}</p>`;
    } else {
      body += `<p class="prompt">${tr.prompt}</p>`;
      if (tr.type === 'choice'){
        body += '<div class="choice-grid">' + tr.options.map(function(opt,i){
          return `<button class="choice-btn" onclick="PG.teamChoice(${i})">${opt}</button>`;
        }).join('') + '</div>';
      } else if (tr.type === 'number' || tr.type === 'text'){
        var itype = tr.type === 'number' ? 'number' : 'text';
        var imode = tr.type === 'number' ? ' inputmode="numeric"' : '';
        body += `<div class="input-row">
          <input class="field" type="${itype}"${imode} id="team-input" placeholder="Votre réponse" onkeydown="if(event.key==='Enter')PG.teamField()">
          <button class="btn btn-primary" onclick="PG.teamField()">Valider</button>
        </div>`;
      } else if (tr.type === 'confirm'){
        body += `<button class="btn btn-go btn-block" onclick="PG.teamConfirm()">✅ On est prêts !</button>`;
      }
      if (attempts > 0) body += `<div class="feedback no">Discutez-en encore un peu tous ensemble…</div>`;
      if (attempts >= 3 && tr.type !== 'confirm'){
        body += `<button class="btn btn-ghost" onclick="PG.revealTeam()">👉 Révéler la réponse</button>`;
      }
    }
    return `<div class="card"><div class="eyebrow"><span class="dot"></span>Énigme d’équipe 🤝</div>${body}</div>`;
  }

  function navigatorFor(stepIndex){
    return CHARACTERS[CHAR_ORDER[stepIndex % CHAR_ORDER.length]];
  }

  function footerSectionHtml(step, stepIndex){
    if (!state.teamDone[stepIndex]) return '';
    var isLast = stepIndex === STEPS.length - 1;
    var mapsCard = '';
    if (!isLast){
      var next = STEPS[stepIndex+1];
      var nav = navigatorFor(stepIndex);
      var isMe = nav.key === state.active;
      mapsCard = `<div class="card char char-${nav.key}">
        <div class="eyebrow"><span class="dot"></span>À vous de naviguer 🧭</div>
        <p>${isMe ? 'C’est ton tour' : 'C’est le tour de ' + nav.emoji + ' ' + nav.name} de guider le groupe avec Google Maps ! ${isMe ? 'Ouvre' : 'Passe-lui l’iPad, puis ouvre'} l’appli, cherche le lieu, appuie sur <strong>Itinéraire</strong>, puis choisis le mode <strong>piéton 🚶</strong> pour trouver le chemin jusqu’à :</p>
        <p class="prompt">📍 ${next.title}</p>
        <a class="maps-link" href="${buildMapsUrl(next.mapsQuery)}" target="_blank" rel="noopener">🗺️ Ouvrir Google Maps</a>
        ${isMe ? '' : `<button class="btn btn-ghost" onclick="PG.switchChar('${nav.key}')">↪ Passer sur le profil de ${nav.name}</button>`}
      </div>`;
    }
    return `<div class="card"><div class="eyebrow"><span class="dot"></span>Le sais-tu ?</div><p>${step.funfact}</p></div>
      ${mapsCard}
      <button class="btn btn-go btn-block" onclick="PG.nextStep()">${isLast ? '🏆 Voir le diplôme final' : '➡️ Étape suivante'}</button>`;
  }

  function renderWelcome(){
    var picks = CHAR_ORDER.map(function(key){
      var c = CHARACTERS[key];
      return `<div class="char-card char-${key}" onclick="PG.selectChar('${key}')">
        <div class="avatar">${c.emoji}</div>
        <div class="cname">${c.name}</div>
        <div class="cage">${c.age} ANS</div>
        <div class="ctag">${c.tagline}</div>
      </div>`;
    }).join('');
    app.innerHTML = `<div class="app-shell">
      <div class="hero">
        ${mascotSvg(112)}
        <h1 class="disp">Le Trésor de Pepe el Cenachero</h1>
        <p>Un seul iPad, que l’on se passe entre enquêteurs. Chacun sa mission : il faut s’entraider pour avancer !</p>
      </div>
      <div class="screen">
        <div class="card">
          <div class="eyebrow"><span class="dot"></span>Qui commence ?</div>
          <div class="char-grid">${picks}</div>
        </div>
        <div class="card">
          <div class="eyebrow"><span class="dot"></span>Avant de partir</div>
          <ul class="kit-list">
            <li>📱 Un seul iPad pour toute la famille, que l’on se passe à chaque mission</li>
            <li>👪 Papa gère le passage d’un profil à l’autre grâce aux pastilles en haut de l’écran</li>
            <li>🔍 Une loupe, un mètre ruban, une boussole (ou juste vos yeux !)</li>
            <li>🚶 3,2 km de balade tranquille, environ 2h30 avec la pause goûter</li>
          </ul>
        </div>
        <a class="maps-link" href="${FULL_ROUTE_URL}" target="_blank" rel="noopener">🗺️ Aperçu du parcours complet (pour les parents)</a>
      </div>
      <p class="footer-note">À chaque étape, les 4 enfants font chacun leur mission à tour de rôle sur le même iPad — les pastilles en haut indiquent qui a déjà joué. Puis un enfant différent ouvre Google Maps pour guider le groupe.</p>
    </div>`;
  }

  function renderStep(){
    var stepIndex = state.stepIndex;
    var step = STEPS[stepIndex];
    app.innerHTML = `<div class="app-shell">
      ${topbarHtml(stepIndex)}
      ${statusRowHtml(stepIndex)}
      <div class="progress-track"><div class="progress-fill" style="width:${Math.round(stepIndex/STEPS.length*100)}%"></div></div>
      ${badgeStripHtml()}
      <div class="screen">
        <div class="mascot-row">
          <div class="mascot-face">${mascotSvg(68)}</div>
          <div class="mascot-bubble">
            <p class="mascot-name">Pepe raconte…</p>
            <p>${step.story}</p>
            ${step.anecdote ? `<div class="anecdote">😄 ${step.anecdote}</div>` : ''}
            ${(state.active==='leopold' && step.extra) ? `<div class="extra-fact">🧠 Anecdote bonus pour toi : ${step.extra}</div>` : ''}
          </div>
        </div>
        ${step.funChallenge && step.funChallenge[state.active] ? `<div class="card defi-card char char-${state.active}"><div class="eyebrow"><span class="dot"></span>Défi de ${CHARACTERS[state.active].name}</div><p>${step.funChallenge[state.active]}</p><button class="btn" onclick="PG.celebrate()">🎉 C’est fait !</button></div>` : ''}
        ${missionSectionHtml(step, stepIndex)}
        ${teamSectionHtml(step, stepIndex)}
        ${footerSectionHtml(step, stepIndex)}
        <button class="btn btn-ghost btn-block" onclick="PG.openModal('reset')">↺ Réinitialiser le jeu</button>
      </div>
    </div>`;
  }

  function renderFinal(){
    var rows = CHAR_ORDER.map(function(k){
      var c = CHARACTERS[k];
      var pieces = piecesFor(k);
      var piecesHtml = pieces.map(function(p){ return `<div class="badge-piece" title="${p.label}">${p.emoji}</div>`; }).join('');
      return `<div class="card char char-${k}">
        <div class="eyebrow"><span class="dot"></span>${c.emoji} ${c.name} · ${c.age} ans</div>
        <div class="pieces-final" style="justify-content:flex-start; margin:0;">${piecesHtml}</div>
      </div>`;
    }).join('');
    app.innerHTML = `<div class="app-shell">
      ${topbarHtml(STEPS.length)}
      <div class="screen">
        <div class="diploma">
          <div class="seal">🏅</div>
          <h2 class="disp">Diplôme des Vrais Malagueños</h2>
          <p>Décerné à toute l’équipe :</p>
          <h3 class="disp">${CHAR_ORDER.map(function(k){ return CHARACTERS[k].name; }).join(' · ')}</h3>
          <p>Pour avoir percé, ensemble, les secrets cachés de Málaga.</p>
        </div>
        ${rows}
        <div class="card"><p><strong>« Muy Hospitalaria »</strong> — le titre que Málaga porte depuis 1900, en mémoire du sauvetage du Gneisenau. La vraie richesse de Málaga n’est pas dans un coffre au trésor, mais dans son histoire et l’hospitalité de ses habitants. ¡Enhorabuena, enquêteurs !</p></div>
        <div class="card"><p>🍫 <strong>Idée de récompense officielle :</strong> une brigade qui vient de percer les secrets de toute une ville a bien mérité des churros con chocolate. Pepe recommande, et Pepe s’y connaît.</p></div>
        <button class="btn btn-ghost btn-block" onclick="PG.resetGame()">↺ Recommencer l’aventure</button>
      </div>
    </div>`;
  }

  function openModal(which){
    var html = '';
    if (which === 'kit'){
      var g = PARENT_GUIDE;
      html = `<h2 class="disp">🎒 Kit de l’enquêteur</h2>
        <p>${g.logistics.zone}</p>
        <ul class="kit-list">${g.logistics.kit.map(function(k){return '<li>• '+k+'</li>';}).join('')}</ul>
        <p class="hint">${g.logistics.duration} — ${g.logistics.length}</p>
        <p class="hint">${g.logistics.hydration}</p>
        <p class="hint">🍰 ${g.logistics.refuel}</p>`;
    } else if (which === 'parent'){
      var g2 = PARENT_GUIDE;
      var perStepHtml = g2.perStep.map(function(txt,i){
        return `<div class="guide-step"><h3>Étape ${i+1} — ${STEPS[i].title}</h3><p>${txt}</p></div>`;
      }).join('');
      html = `<h2 class="disp">👪 Espace parent</h2>
        <p>${g2.intro} C’est vous qui gérez le passage de l’iPad d’un enfant à l’autre — via les pastilles en haut de l’écran, ou en rouvrant ce menu.</p>
        ${perStepHtml}
        <button class="btn btn-ghost btn-block" onclick="PG.openModal('reset')">↺ Réinitialiser le jeu</button>`;
    } else if (which === 'reset'){
      html = `<h2 class="disp">↺ Réinitialiser le jeu</h2>
        <p>Toute la progression des 4 enfants (missions validées, indices trouvés, étape en cours) sera effacée, et vous reviendrez au choix du premier profil.</p>
        <div class="input-row">
          <button class="btn btn-block" onclick="PG.closeModal()">Annuler</button>
          <button class="btn btn-primary btn-block" onclick="PG.confirmReset()">Oui, tout effacer</button>
        </div>`;
      html += '<!--noclose-->';
    }
    if (html.indexOf('<!--noclose-->') === -1){
      html += `<button class="btn btn-block" style="margin-top:12px" onclick="PG.closeModal()">Fermer</button>`;
    } else {
      html = html.replace('<!--noclose-->','');
    }
    closeModal();
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'pg-modal';
    overlay.innerHTML = `<div class="modal">${html}</div>`;
    overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
    document.body.appendChild(overlay);
  }
  function closeModal(){
    var el = document.getElementById('pg-modal');
    if (el) el.remove();
  }

  function burstConfetti(){
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    var emojis = ['🎉','✨','🌟','🐟','🌸','🏅'];
    for (var i=0;i<22;i++){
      var s = document.createElement('span');
      s.className = 'confetto';
      s.textContent = emojis[i % emojis.length];
      s.style.left = (Math.random()*100) + 'vw';
      s.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
      s.style.animationDelay = (Math.random()*0.3) + 's';
      layer.appendChild(s);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 3200);
  }

  function markMissionDone(charKey, stepIndex){ state.progress[charKey].missionDone[stepIndex] = true; saveState(); burstConfetti(); render(); }
  function markMissionWrong(charKey, stepIndex){ var p = state.progress[charKey]; p.attempts[stepIndex] = (p.attempts[stepIndex]||0) + 1; saveState(); render(); }
  function markTeamDone(stepIndex){ state.teamDone[stepIndex] = true; saveState(); burstConfetti(); render(); }
  function markTeamWrong(stepIndex){ state.teamAttempts[stepIndex] = (state.teamAttempts[stepIndex]||0) + 1; saveState(); render(); }

  var PG = {
    selectChar:function(key){ state.active = key; saveState(); render(); },
    switchChar:function(key){ state.active = key; saveState(); render(); },
    confirmReset:function(){ closeModal(); state = defaultState(); saveState(); render(); },
    resetGame:function(){ state = defaultState(); saveState(); render(); },
    openModal:openModal,
    closeModal:closeModal,
    answerChoice:function(stepIndex, idx){
      var m = STEPS[stepIndex].missions[state.active];
      if (idx === m.answer) markMissionDone(state.active, stepIndex); else markMissionWrong(state.active, stepIndex);
    },
    answerField:function(stepIndex){
      var m = STEPS[stepIndex].missions[state.active];
      var input = document.getElementById('mission-input-'+stepIndex);
      var raw = input ? input.value : '';
      var ok = m.type === 'number' ? (parseInt(raw,10) === m.answer) : (normalizeText(raw) === normalizeText(m.answer));
      if (ok) markMissionDone(state.active, stepIndex); else markMissionWrong(state.active, stepIndex);
    },
    answerConfirm:function(stepIndex){ markMissionDone(state.active, stepIndex); },
    revealMission:function(stepIndex){ markMissionDone(state.active, stepIndex); },
    teamChoice:function(idx){
      var tr = STEPS[state.stepIndex].teamRiddle;
      if (idx === tr.answer) markTeamDone(state.stepIndex); else markTeamWrong(state.stepIndex);
    },
    teamField:function(){
      var tr = STEPS[state.stepIndex].teamRiddle;
      var input = document.getElementById('team-input');
      var raw = input ? input.value : '';
      var ok = tr.type === 'number' ? (parseInt(raw,10) === tr.answer) : (normalizeText(raw) === normalizeText(tr.answer));
      if (ok) markTeamDone(state.stepIndex); else markTeamWrong(state.stepIndex);
    },
    teamConfirm:function(){ markTeamDone(state.stepIndex); },
    revealTeam:function(){ markTeamDone(state.stepIndex); },
    nextStep:function(){ state.stepIndex++; saveState(); render(); },
    celebrate:function(){ burstConfetti(); }
  };
  window.PG = PG;

  function render(){
    if (!state.active){ renderWelcome(); return; }
    if (state.stepIndex >= STEPS.length){ renderFinal(); return; }
    renderStep();
  }

  render();
})();
</script>
</body>
</html>
