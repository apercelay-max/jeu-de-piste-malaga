<title>Le Trésor de Pepe el Cenachero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bevan&family=Rubik:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --cal:#EFF2EE; --paper:#FBFAF5; --ink:#1E2523; --ink-soft:#5B6663; --line:#D8DED6;
  --azulejo:#1C6E8C; --azulejo-ink:#FFFFFF;
  --albero:#C97A2B; --albero-ink:#FFFFFF;
  --buganvilla:#C23B6C; --buganvilla-ink:#FFFFFF;
  --jazmin:#5D7C48; --jazmin-ink:#FFFFFF;
  --sol:#C98A0E; --sol-ink:#FFFFFF;
  --danger:#B23B26; --danger-ink:#FFFFFF;
  --shadow-hard: rgba(30,37,35,0.85); --shadow-soft: rgba(30,37,35,0.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cal:#141B19; --paper:#1D2523; --ink:#EDF2EF; --ink-soft:#AEB9B5; --line:#334039;
    --azulejo:#5FC1E8; --azulejo-ink:#0A2530;
    --albero:#F2A857; --albero-ink:#2B1B08;
    --buganvilla:#EA7FAE; --buganvilla-ink:#3A0E1E;
    --jazmin:#A9C98C; --jazmin-ink:#16210E;
    --sol:#F0C246; --sol-ink:#2B1B08;
    --danger:#E8695F; --danger-ink:#2B0805;
    --shadow-hard: rgba(0,0,0,0.85); --shadow-soft: rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --cal:#141B19; --paper:#1D2523; --ink:#EDF2EF; --ink-soft:#AEB9B5; --line:#334039;
  --azulejo:#5FC1E8; --azulejo-ink:#0A2530;
  --albero:#F2A857; --albero-ink:#2B1B08;
  --buganvilla:#EA7FAE; --buganvilla-ink:#3A0E1E;
  --jazmin:#A9C98C; --jazmin-ink:#16210E;
  --sol:#F0C246; --sol-ink:#2B1B08;
  --danger:#E8695F; --danger-ink:#2B0805;
  --shadow-hard: rgba(0,0,0,0.85); --shadow-soft: rgba(0,0,0,0.35);
}
.char-camille{--char:var(--buganvilla);--char-ink:var(--buganvilla-ink);}
.char-maeva{--char:var(--sol);--char-ink:var(--sol-ink);}
.char-madeline{--char:var(--azulejo);--char-ink:var(--azulejo-ink);}
.char-leopold{--char:var(--albero);--char-ink:var(--albero-ink);}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cal); color:var(--ink);
  font-family:'Rubik',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.45;
  min-height:100vh;
}
h1,h2,h3,.disp{font-family:'Bevan',Georgia,'Times New Roman',serif; font-weight:400; text-wrap:balance; letter-spacing:.2px;}
.mono{font-family:'Space Mono','SFMono-Regular',Consolas,monospace;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--azulejo); outline-offset:2px;}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

.app-shell{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:0 0 48px;}

/* ---- tile badge chrome ---- */
.tile{
  border:3px solid var(--ink); border-radius:6px; background:var(--paper);
  box-shadow:3px 3px 0 var(--shadow-hard);
  font-family:'Space Mono',monospace; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
}
.topbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:14px 16px 10px; position:sticky; top:0; z-index:5;
  background:var(--cal); border-bottom:1px solid var(--line);
}
.topbar .tile{padding:6px 10px; font-size:.72rem; display:flex; align-items:center; gap:6px;}
.tile-char{background:var(--char); color:var(--char-ink); border-color:var(--ink);}
.topbar .spacer{flex:1;}
.icon-btn{
  border:3px solid var(--ink); border-radius:6px; background:var(--paper); color:var(--ink);
  box-shadow:2px 2px 0 var(--shadow-hard); width:40px; height:40px; font-size:1.1rem;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.icon-btn:active{transform:translate(2px,2px); box-shadow:none;}

.progress-track{height:10px; border-radius:6px; background:var(--line); border:2px solid var(--ink); overflow:hidden; margin:0 16px;}
.progress-fill{height:100%; background:var(--char, var(--azulejo)); transition:width .4s ease;}

.badge-strip{display:flex; gap:6px; padding:10px 16px 0; flex-wrap:wrap;}
.badge-piece{
  width:38px; height:38px; border-radius:50%; border:2.5px solid var(--ink); background:var(--paper);
  display:flex; align-items:center; justify-content:center; font-size:1.1rem;
  box-shadow:2px 2px 0 var(--shadow-hard);
}
.badge-piece.empty{opacity:.25; border-style:dashed; box-shadow:none;}

/* ---- content ---- */
.screen{padding:18px 16px 8px; display:flex; flex-direction:column; gap:18px;}

.mascot-row{display:flex; gap:12px; align-items:flex-start;}
.mascot-face{flex:none;}
.mascot-bubble{
  position:relative; background:var(--paper); border:2px solid var(--line); border-radius:14px;
  padding:14px 16px; box-shadow:0 3px 0 var(--shadow-soft);
  background-image:repeating-linear-gradient(var(--paper) 0 27px, var(--line) 27px 28px);
  background-position:0 10px;
}
.mascot-bubble::before{
  content:""; position:absolute; left:-9px; top:18px; width:0; height:0;
  border-top:8px solid transparent; border-bottom:8px solid transparent; border-right:9px solid var(--line);
}
.mascot-bubble p{margin:0 0 8px; max-width:58ch;}
.mascot-bubble p:last-child{margin-bottom:0;}
.mascot-name{font-family:'Bevan',serif; color:var(--albero); font-size:.95rem; margin:0 0 4px;}
.extra-fact{
  margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); font-size:.88rem; color:var(--ink-soft);
}

.card{
  background:var(--paper); border:2px solid var(--line); border-radius:14px; padding:16px;
  box-shadow:0 3px 0 var(--shadow-soft); display:flex; flex-direction:column; gap:12px;
}
.card.char{border-color:var(--char); border-width:2.5px;}
.eyebrow{
  display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:.72rem;
  text-transform:uppercase; letter-spacing:.08em; color:var(--char, var(--ink-soft)); font-weight:700;
}
.eyebrow .dot{width:8px; height:8px; border-radius:50%; background:var(--char, var(--azulejo));}
.prompt{font-size:1.12rem; font-weight:600; margin:0;}

.choice-grid{display:grid; gap:10px;}
.choice-btn{
  text-align:left; padding:12px 14px; border-radius:10px; border:2.5px solid var(--ink); background:var(--cal);
  font-size:1rem; font-weight:500; cursor:pointer; color:var(--ink); box-shadow:2px 2px 0 var(--shadow-hard);
}
.choice-btn:active{transform:translate(2px,2px); box-shadow:none;}
.choice-btn.correct{background:var(--jazmin); color:var(--jazmin-ink); border-color:var(--jazmin);}
.choice-btn.wrong{background:var(--danger); color:var(--danger-ink); border-color:var(--danger); animation:shake .35s;}
.choice-btn:disabled{cursor:default;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

.input-row{display:flex; gap:10px; flex-wrap:wrap;}
.field{
  flex:1; min-width:140px; padding:12px 14px; border-radius:10px; border:2.5px solid var(--ink);
  background:var(--cal); color:var(--ink); font-size:1.15rem; font-family:'Space Mono',monospace;
}
.btn{
  border:3px solid var(--ink); border-radius:10px; padding:12px 20px; font-weight:700; font-size:1rem;
  cursor:pointer; box-shadow:3px 3px 0 var(--shadow-hard); background:var(--paper); color:var(--ink);
}
.btn:active{transform:translate(3px,3px); box-shadow:none;}
.btn-primary{background:var(--azulejo); color:var(--azulejo-ink); border-color:var(--ink);}
.btn-go{background:var(--jazmin); color:var(--jazmin-ink);}
.btn-block{width:100%;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-ghost{background:transparent; box-shadow:none; border-style:dashed; font-size:.85rem; padding:8px 14px;}

.feedback{border-radius:10px; padding:12px 14px; font-weight:600;}
.feedback.ok{background:var(--jazmin); color:var(--jazmin-ink);}
.feedback.no{background:var(--danger); color:var(--danger-ink);}
.hint{font-size:.9rem; color:var(--ink-soft); font-style:italic; margin:0;}

.stamp{
  display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border:3px solid var(--jazmin);
  color:var(--jazmin); border-radius:8px; font-family:'Space Mono',monospace; text-transform:uppercase;
  font-weight:700; letter-spacing:.05em; transform:rotate(-4deg); animation:stampIn .3s ease-out;
}
@keyframes stampIn{from{transform:rotate(-4deg) scale(2); opacity:0;} to{transform:rotate(-4deg) scale(1); opacity:1;}}

.maps-link{
  display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none;
  background:var(--azulejo); color:var(--azulejo-ink); border:3px solid var(--ink); border-radius:12px;
  padding:16px; font-weight:700; font-size:1.05rem; box-shadow:3px 3px 0 var(--shadow-hard);
}
.maps-link:active{transform:translate(3px,3px); box-shadow:none;}

.char-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:420px){.char-grid{grid-template-columns:1fr;}}
.char-card{
  border:3px solid var(--ink); border-radius:14px; padding:16px; background:var(--paper); cursor:pointer;
  box-shadow:3px 3px 0 var(--shadow-hard); text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center;
}
.char-card:active{transform:translate(3px,3px); box-shadow:none;}
.char-card .avatar{
  width:56px; height:56px; border-radius:50%; background:var(--char); color:var(--char-ink);
  display:flex; align-items:center; justify-content:center; font-size:1.8rem; border:2px solid var(--ink);
}
.char-card .cname{font-family:'Bevan',serif; font-size:1.15rem;}
.char-card .cage{font-family:'Space Mono',monospace; font-size:.78rem; color:var(--ink-soft);}
.char-card .ctag{font-size:.82rem; color:var(--char);}

.hero{text-align:center; padding:28px 16px 6px;}
.hero h1{font-size:2rem; margin:6px 0 4px; color:var(--albero);}
.hero p{color:var(--ink-soft); max-width:44ch; margin:0 auto;}

.kit-list{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none;}
.kit-list li{display:flex; gap:10px; align-items:flex-start; font-size:.95rem;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(20,27,25,.55); display:flex; align-items:flex-end;
  justify-content:center; z-index:20; padding:0;
}
@media (min-width:640px){.modal-overlay{align-items:center;}}
.modal{
  background:var(--paper); border-radius:18px 18px 0 0; border:3px solid var(--ink); border-bottom:none;
  max-width:560px; width:100%; max-height:82vh; overflow-y:auto; padding:20px 18px 26px;
  box-shadow:0 -4px 0 var(--shadow-hard);
}
@media (min-width:640px){.modal{border-radius:16px; border-bottom:3px solid var(--ink); box-shadow:5px 5px 0 var(--shadow-hard);}}
.modal h2{margin-top:0;}
.modal-close{float:right;}

.diploma{border:4px double var(--albero); border-radius:16px; padding:22px; text-align:center; background:var(--paper);}
.diploma .seal{font-size:3rem;}
.pieces-final{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:14px 0;}

.confetti-layer{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:30;}
.confetto{position:absolute; top:-20px; font-size:1.4rem; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg); opacity:.9;}}

.guide-step{border-left:4px solid var(--albero); padding-left:12px; margin-bottom:14px;}
.guide-step h3{margin:0 0 4px; font-size:1rem;}
.guide-step p{margin:0; font-size:.92rem; color:var(--ink-soft);}

.footer-note{text-align:center; font-size:.78rem; color:var(--ink-soft); padding:18px 16px 0;}
</style>

<div id="app"></div>

  function defaultState(){ return { character:null, stepIndex:0, missionDone:{}, teamDone:{}, attempts:{} }; }
  function loadState(){
    try{ var s = JSON.parse(localStorage.getItem(STORAGE_KEY)); return s || defaultState(); }
    catch(e){ return defaultState(); }
  }
  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
  var state = loadState();

  var app = document.getElementById('app');

  function mascotSvg(size){
    size = size || 64;
    return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="Pepe el Cenachero">
      <circle cx="60" cy="68" r="38" fill="#E7B583"/>
      <path d="M14 52 Q60 2 106 52 Q60 34 14 52Z" style="fill:var(--albero)"/>
      <rect x="10" y="46" width="100" height="11" rx="5.5" style="fill:var(--albero)"/>

      <circle cx="75" cy="70" r="4.2" style="fill:var(--ink)"/>
      <path d="M40 86 Q60 98 82 86" style="stroke:var(--ink)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M34 82 Q47 74 41 84 Q52 78 60 84 Q68 78 81 84 Q75 74 88 82" style="stroke:var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>`;
  }

  function piecesForChar(){
    var pieces = [];
    for (var i=0;i<STEPS.length;i++){
      var m = STEPS[i].missions[state.character];
      if (state.missionDone[i] && m && m.piece) pieces.push(m.piece);
    }
    return pieces;
  }

  function badgeStripHtml(){
    var pieces = piecesForChar();
    var html = '<div class="badge-strip">';
    for (var i=0;i<STEPS.length;i++){
      if (pieces[i]) html += `<div class="badge-piece" title="${pieces[i].label}">${pieces[i].emoji}</div>`;
      else html += '<div class="badge-piece empty">?</div>';
    }
    return html + '</div>';
  }

  function topbarHtml(stepIndex){
    var c = CHARACTERS[state.character];
    var stepLabel = stepIndex < STEPS.length ? ('Étape ' + (stepIndex+1) + '/' + STEPS.length) : 'Terminé !';
    var dist = STEPS[Math.min(stepIndex, STEPS.length-1)].distance;
    return `<div class="topbar char-${state.character}">
      <div class="tile tile-char">${c.emoji} ${c.name} · ${c.age} ans</div>
      <div class="tile">${stepLabel}</div>
      <div class="tile">📍 ${dist}</div>
      <div class="spacer"></div>
      <button class="icon-btn" onclick="PG.openModal('kit')" aria-label="Kit de l’enquêteur">🎒</button>
      <button class="icon-btn" onclick="PG.openModal('parent')" aria-label="Espace parent">👪</button>
    </div>`;
  }

  function normalizeText(v){ return (v||'').toString().trim().toLowerCase(); }

  function missionSectionHtml(step, stepIndex){
    var m = step.missions[state.character];
    var done = !!state.missionDone[stepIndex];
    var attempts = state.attempts[stepIndex] || 0;
    var c = CHARACTERS[state.character];
    var body = '';
    if (done){
      body = `<div class="stamp">✔ Validé — ${m.piece.emoji} ${m.piece.label}</div><p>${m.success}</p>`;
    } else {
      body += `<p class="prompt">${m.prompt}</p>`;
      if (m.type === 'choice'){
        body += '<div class="choice-grid">' + m.options.map(function(opt,i){
          return `<button class="choice-btn" onclick="PG.answerChoice(${stepIndex},${i})">${opt}</button>`;
        }).join('') + '</div>';
      } else if (m.type === 'number' || m.type === 'text'){
        var itype = m.type === 'number' ? 'number' : 'text';
        var imode = m.type === 'number' ? ' inputmode="numeric"' : '';
        body += `<div class="input-row">
          <input class="field" type="${itype}"${imode} id="mission-input-${stepIndex}" placeholder="Ta réponse" onkeydown="if(event.key==='Enter')PG.answerField(${stepIndex})">
          <button class="btn btn-primary" onclick="PG.answerField(${stepIndex})">Valider</button>
        </div>`;
      } else if (m.type === 'confirm'){
        body += `<button class="btn btn-go btn-block" onclick="PG.answerConfirm(${stepIndex})">✅ C’est fait !</button>`;
      }
      if (attempts > 0){
        body += `<div class="feedback no">Pas tout à fait ! Réessaie.</div><p class="hint">💡 ${m.hint||''}</p>`;
      }
      if (attempts >= 3 && m.type !== 'confirm'){
        body += `<button class="btn btn-ghost" onclick="PG.revealMission(${stepIndex})">👉 Révéler la réponse</button>`;
      }
    }
    return `<div class="card char char-${state.character}">
      <div class="eyebrow"><span class="dot"></span>Mission de ${c.name}</div>
      ${body}
    </div>`;
  }

  function teamSectionHtml(step, stepIndex){
    var missionDone = !!state.missionDone[stepIndex];
    var done = !!state.teamDone[stepIndex];
    var attempts = state.attempts['t'+stepIndex] || 0;
    var tr = step.teamRiddle;
    if (!missionDone){
      return `<div class="card"><div class="eyebrow"><span class="dot"></span>Énigme d’équipe 🤝</div>
        <p class="hint">🔒 Termine d’abord ta mission pour débloquer l’énigme commune.</p></div>`;
    }
    var body = '';
    if (done){
      body = `<div class="stamp">✔ Débloqué</div><p>${tr.success}</p>`;
    } else {
      body += `<p class="prompt">${tr.prompt}</p>`;
      if (tr.type === 'choice'){
        body += '<div class="choice-grid">' + tr.options.map(function(opt,i){
          return `<button class="choice-btn" onclick="PG.teamChoice(${i})">${opt}</button>`;
        }).join('') + '</div>';
      } else if (tr.type === 'number' || tr.type === 'text'){
        var itype = tr.type === 'number' ? 'number' : 'text';
        var imode = tr.type === 'number' ? ' inputmode="numeric"' : '';
        body += `<div class="input-row">
          <input class="field" type="${itype}"${imode} id="team-input" placeholder="Votre réponse" onkeydown="if(event.key==='Enter')PG.teamField()">
          <button class="btn btn-primary" onclick="PG.teamField()">Valider</button>
        </div>`;
      } else if (tr.type === 'confirm'){
        body += `<button class="btn btn-go btn-block" onclick="PG.teamConfirm()">✅ On est prêts !</button>`;
      }
      if (attempts > 0) body += `<div class="feedback no">Discutez-en encore un peu tous ensemble…</div>`;
      if (attempts >= 3 && tr.type !== 'confirm'){
        body += `<button class="btn btn-ghost" onclick="PG.revealTeam()">👉 Révéler la réponse</button>`;
      }
    }
    return `<div class="card"><div class="eyebrow"><span class="dot"></span>Énigme d’équipe 🤝</div>${body}</div>`;
  }

  function footerSectionHtml(step, stepIndex){
    if (!state.teamDone[stepIndex]) return '';
    var isLast = stepIndex === STEPS.length - 1;
    var mapsBtn = isLast ? '' : `<a class="maps-link" href="${buildMapsUrl(STEPS[stepIndex+1].mapsQuery)}" target="_blank" rel="noopener">🗺️ Ouvrir l’itinéraire vers la suite</a>`;
    return `<div class="card"><div class="eyebrow"><span class="dot"></span>Le sais-tu ?</div><p>${step.funfact}</p></div>
      ${mapsBtn}
      <button class="btn btn-go btn-block" onclick="PG.nextStep()">${isLast ? '🏆 Voir le diplôme final' : '➡️ Étape suivante'}</button>`;
  }

    var stepIndex = state.stepIndex;

      ${topbarHtml(stepIndex)}
      <div class="progress-track"><div class="progress-fill char-${state.character}" style="width:${Math.round(stepIndex/STEPS.length*100)}%"></div></div>

    var c = CHARACTERS[state.character];

  function openModal(which){
    var html = '';
    if (which === 'kit'){
      var g = PARENT_GUIDE;
      html = `<h2 class="disp">🎒 Kit de l’enquêteur</h2>
        <p>${g.logistics.zone}</p>
        <ul class="kit-list">${g.logistics.kit.map(function(k){return '<li>• '+k+'</li>';}).join('')}</ul>
        <p class="hint">${g.logistics.duration} — ${g.logistics.length}</p>
        <p class="hint">${g.logistics.hydration}</p>
        <p class="hint">🍰 ${g.logistics.refuel}</p>`;
    } else if (which === 'parent'){
      var g2 = PARENT_GUIDE;
      var perStepHtml = g2.perStep.map(function(txt,i){
        return `<div class="guide-step"><h3>Étape ${i+1} — ${STEPS[i].title}</h3><p>${txt}</p></div>`;
      }).join('');
      html = `<h2 class="disp">👪 Espace parent</h2>
        <p>${g2.intro}</p>
        ${perStepHtml}
        <button class="btn btn-ghost btn-block" onclick="PG.changeChar()">Changer de profil sur cet iPad</button>`;
    }
    html += `<button class="btn btn-block" style="margin-top:12px" onclick="PG.closeModal()">Fermer</button>`;
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'pg-modal';
    overlay.innerHTML = `<div class="modal">${html}</div>`;
    overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
    document.body.appendChild(overlay);
  }
  function closeModal(){
    var el = document.getElementById('pg-modal');
    if (el) el.remove();
  }

  function burstConfetti(){
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    var emojis = ['🎉','✨','🌟','🐟','🌸','🏅'];
    for (var i=0;i<22;i++){
      var s = document.createElement('span');
      s.className = 'confetto';
      s.textContent = emojis[i % emojis.length];
      s.style.left = (Math.random()*100) + 'vw';
      s.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
      s.style.animationDelay = (Math.random()*0.3) + 's';
      layer.appendChild(s);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 3200);
  }

  function markMissionDone(stepIndex){ state.missionDone[stepIndex] = true; saveState(); burstConfetti(); render(); }
  function markMissionWrong(stepIndex){ state.attempts[stepIndex] = (state.attempts[stepIndex]||0) + 1; saveState(); render(); }
  function markTeamDone(stepIndex){ state.teamDone[stepIndex] = true; saveState(); burstConfetti(); render(); }
  function markTeamWrong(stepIndex){ state.attempts['t'+stepIndex] = (state.attempts['t'+stepIndex]||0) + 1; saveState(); render(); }

    openModal:openModal,
    closeModal:closeModal,
    answerChoice:function(stepIndex, idx){
      var m = STEPS[stepIndex].missions[state.character];
      if (idx === m.answer) markMissionDone(stepIndex); else markMissionWrong(stepIndex);
    },
    answerField:function(stepIndex){
      var m = STEPS[stepIndex].missions[state.character];
      var input = document.getElementById('mission-input-'+stepIndex);
      var raw = input ? input.value : '';
      var ok = m.type === 'number' ? (parseInt(raw,10) === m.answer) : (normalizeText(raw) === normalizeText(m.answer));
      if (ok) markMissionDone(stepIndex); else markMissionWrong(stepIndex);
    },
    answerConfirm:function(stepIndex){ markMissionDone(stepIndex); },
    revealMission:function(stepIndex){ markMissionDone(stepIndex); },
    teamChoice:function(idx){
      var tr = STEPS[state.stepIndex].teamRiddle;
      if (idx === tr.answer) markTeamDone(state.stepIndex); else markTeamWrong(state.stepIndex);
    },
    teamField:function(){
      var tr = STEPS[state.stepIndex].teamRiddle;
      var input = document.getElementById('team-input');
      var raw = input ? input.value : '';
      var ok = tr.type === 'number' ? (parseInt(raw,10) === tr.answer) : (normalizeText(raw) === normalizeText(tr.answer));
      if (ok) markTeamDone(state.stepIndex); else markTeamWrong(state.stepIndex);
    },
    teamConfirm:function(){ markTeamDone(state.stepIndex); },
    revealTeam:function(){ markTeamDone(state.stepIndex); },
    nextStep:function(){ state.stepIndex++; saveState(); render(); }
  };
  window.PG = PG;

  function render(){
    if (!state.character){ renderWelcome(); return; }
    if (state.stepIndex >= STEPS.length){ renderFinal(); return; }
    renderStep();
  }

  render();
})();
</script>
